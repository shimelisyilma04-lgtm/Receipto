version: '3.8'

services:
  receipto:
    build:
      context: .
      dockerfile: Dockerfile
    image: receipto:latest
    container_name: receipto-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_BASE_URL=http://localhost:3000
      - FIRESTORE_DATABASE_ID=ai-studio-receptio-29c007e0-504b-47c8-9f48-f964bdf89cf7
      - FIRESTORE_PROJECT_ID=peta-xylopolist-hrrhs
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-billing@receipto.io}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
